name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Verify protected repository file
        run: python scripts/verify_protected_file.py

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0, 'src'); from youtube_factory import __version__; print(__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Check tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ($env:TAG_NAME -ne "v$env:APP_VERSION") {
            throw "Tag $env:TAG_NAME does not match application version v$env:APP_VERSION"
          }

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build executable
        run: python -m PyInstaller youtube_factory.spec --noconfirm --clean

      - name: Name the release asset
        id: asset
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $name = "YouTubeFactory-v$env:APP_VERSION-windows-x64.exe"
          Copy-Item dist\YouTubeFactory.exe "dist\$name"
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Smoke test the executable
        shell: pwsh
        timeout-minutes: 5
        env:
          ASSET_NAME: ${{ steps.asset.outputs.name }}
        run: |
          $log = Join-Path $PWD "smoke.log"
          $env:YF_SMOKE_LOG = $log
          $proc = Start-Process -FilePath "dist\$env:ASSET_NAME" -ArgumentList "--smoke-test" -PassThru
          if (-not $proc.WaitForExit(90000)) {
            Write-Host "Smoke test did not finish in 90 s. Windows with titles:"
            Get-Process | Where-Object { $_.MainWindowTitle } |
              Select-Object Id, ProcessName, MainWindowTitle | Format-Table -AutoSize | Out-String | Write-Host
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $bmp.Save((Join-Path $PWD "smoke-screen.png"))
            Get-Process | Where-Object { $_.ProcessName -like "YouTubeFactory*" } | Stop-Process -Force
            if (Test-Path $log) { Get-Content $log }
            throw "Smoke test timed out"
          }
          if (Test-Path $log) { Get-Content $log }
          if ($proc.ExitCode -ne 0) { throw "Smoke test failed with exit code $($proc.ExitCode)" }

      - name: Upload smoke test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics
          path: |
            smoke.log
            smoke-screen.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Checksum
        shell: pwsh
        env:
          ASSET_NAME: ${{ steps.asset.outputs.name }}
        run: |
          $hash = (Get-FileHash "dist\$env:ASSET_NAME" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ASSET_NAME" | Out-File -Encoding ascii "dist\$env:ASSET_NAME.sha256"
          Get-Content "dist\$env:ASSET_NAME.sha256"

      - name: Verify protected repository file again
        run: python scripts/verify_protected_file.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-factory-windows-x64
          path: |
            dist/${{ steps.asset.outputs.name }}
            dist/${{ steps.asset.outputs.name }}.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: youtube-factory-windows-x64
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          notes=".github/release-notes/${TAG_NAME}.md"
          if [ -f "$notes" ]; then
            notes_args=(--notes-file "$notes")
          else
            notes_args=(--generate-notes)
          fi
          gh release create "$TAG_NAME" dist/*.exe dist/*.sha256 \
            --title "YouTube Factory ${TAG_NAME}" \
            --verify-tag \
            "${notes_args[@]}"
