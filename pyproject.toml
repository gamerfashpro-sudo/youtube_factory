[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-factory"
version = "0.2.0"
description = "YouTube Factory: turn a long YouTube video into ready-to-publish Shorts ideas."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.5",
    "pyinstaller>=6.5",
]

[project.scripts]
youtube-factory = "youtube_factory.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
youtube_factory = ["resources/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/youtube_factory/ui/icons.py" = ["E501"]
# Demo transcript and analyzer word lists contain long Russian text lines.
"src/youtube_factory/services/demo.py" = ["E501"]
"src/youtube_factory/services/analyzer.py" = ["E501"]
"src/youtube_factory/strings_ru.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
